version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dev-minor-e-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ['minor', 'patch']
    labels: ['dependencies', 'npm']
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 7

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: 'chore(ci)'
    cooldown:
      default-days: 7
