name: CI

# PROJECT.md §5 (F0.5) e §8. Cinco checks: verify, doc-drift, e2e, bench
# (Lighthouse CI + size-limit contra o orçamento do §10, desde a F5) e audit.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (lifecycle scripts bloqueados — PROJECT.md §8)
        run: npm ci --ignore-scripts
      - name: npm run verify (typecheck, lint, formatação, testes com cobertura, build)
        run: npm run verify
      - name: Cobertura para o doc:sync (job doc-drift também precisa dela)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: error

  doc-drift:
    name: doc-drift
    runs-on: ubuntu-latest
    # Também depende de `bench`: a região AUTO:bench só reproduz o número
    # commitado se tiver o mesmo `.size-limit.json` que o `bench` gerou — ver
    # nota abaixo. `if: !cancelled()` (em vez do padrão implícito de `needs`)
    # deixa este job rodar mesmo se `bench` falhar: `bench` já é check
    # obrigatório por conta própria, e aqui só precisamos do artefato que ele
    # produziu antes de falhar (size-limit roda e grava o arquivo antes do
    # Lighthouse, que é a parte instável).
    needs: [verify, bench]
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (lifecycle scripts bloqueados)
        run: npm ci --ignore-scripts
      - name: Baixar cobertura (para a região AUTO:tests)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
          path: coverage
      # `continue-on-error`: se `bench` falhar antes de gravar o arquivo (ex.:
      # `next build` quebrado), o artefato não existe — `doc:check` cai para
      # "_pendente_" na região AUTO:bench, e falha do jeito certo (comparando
      # contra o PROJECT.md commitado) em vez de travar num erro de download
      # que mascara a causa real.
      - name: Baixar size-limit (para a região AUTO:bench)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: size-limit-json
          path: .
      - name: PROJECT.md sincronizado?
        run: npm run doc:check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (lifecycle scripts bloqueados)
        run: npm ci --ignore-scripts
      - name: Instalar navegadores do Playwright (DT-008)
        run: npx playwright install --with-deps chromium webkit
      - name: E2E + axe contra o build de produção
        run: npm run test:e2e
      - name: Publicar relatório do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  bench:
    name: bench
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (lifecycle scripts bloqueados)
        run: npm ci --ignore-scripts
      - name: Instalar Chromium do Playwright (o Lighthouse audita com ele — DT-008)
        run: npx playwright install --with-deps chromium
      - name: npm run bench (Lighthouse CI + size-limit — PROJECT.md §10)
        run: npm run bench
      # `if: always()`: `scripts/bench.mjs` grava `.size-limit.json` antes de
      # rodar o Lighthouse, então o arquivo existe mesmo se o passo acima
      # falhar depois, no Lighthouse. `doc-drift` precisa dele para
      # reproduzir a região AUTO:bench do PROJECT.md — sem isso, aquele job
      # não tem como recalcular o mesmo número que está commitado, e falha em
      # todo push, independente do documento estar de fato desatualizado.
      - name: Artefato size-limit (para a região AUTO:bench do doc-drift)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-limit-json
          path: .size-limit.json
          retention-days: 7
          if-no-files-found: warn

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências (lifecycle scripts bloqueados)
        run: npm ci --ignore-scripts
      - name: npm audit signatures (proveniência do registry)
        run: npm audit signatures
      - name: lockfile-lint (todo `resolved` aponta para o registry oficial em https)
        run: npx --yes lockfile-lint@5.0.0 --path package-lock.json --type npm --validate-https --allowed-hosts npm
      - name: npm audit --audit-level=high (bloqueante — árvore de produção)
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit --audit-level=high (árvore completa, informativo — DT-006/ADR-007)
        run: |
          npm audit --audit-level=high || {
            echo "::warning::achados na árvore de dev (não bloqueante) — ver DT-006 em PROJECT.md";
            true;
          }
