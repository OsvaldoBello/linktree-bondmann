name: Release

# PROJECT.md §8. SBOM CycloneDX do build de produção, assinado com proveniência
# verificável (actions/attest-build-provenance). O deploy real é feito pela
# Vercel (integração nativa com o GitHub) — este workflow não publica nada,
# só gera e assina o registro do que foi construído a partir de qual commit.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sbom:
    name: sbom-and-attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # exigido pelo OIDC do attest-build-provenance para assinar a proveniência
      attestations: write # necessário para publicar o atestado no repositório
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        # Cache desligado de propósito: workflow de release/publish, cache
        # compartilhado entre refs é superfície de cache-poisoning aqui (zizmor).
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Instalar dependências (lifecycle scripts bloqueados)
        run: npm ci --ignore-scripts
      - name: Build de produção
        run: npm run build
      - name: Gerar SBOM CycloneDX (versão fixada)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-format json --output-file sbom.cdx.json
      - name: Assinar proveniência do build (SBOM como sujeito)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: sbom.cdx.json
      - name: Publicar SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error
